<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アラームアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>アラームアプリ</h1>

    <div class="clock" id="clock">00:00:00</div>

    <div class="alarm-section">
      <label for="alarm-time">アラーム時刻</label>
      <input type="time" id="alarm-time" step="60">
      <button id="toggle-btn" class="btn btn-set">セット</button>
    </div>

    <div class="status" id="status">アラームが設定されていません</div>

    <div class="alarm-list" id="alarm-list"></div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <p>アラームの時刻です！</p>
      <button id="dismiss-btn" class="btn btn-dismiss">停止</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
